# Run herdr (the persistent terminal workspace manager) by default on every new
# alacritty session.
[terminal.shell]
program = "herdr"

[window]
opacity = 0.85
# Disabling this on MacOS will prevent the window from having tabs.
decorations = "None"
startup_mode = "Maximized"

[font]
size = 14.0
normal = { family = "FiraCode Nerd Font" }
