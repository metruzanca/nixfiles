theme = "onedarker"

[keys.normal]
C-q = ":q"

[keys.insert]
C-backspace = "delete_word_backward"

[editor]
true-color = true
# See https://twitter.com/swlkr/status/1651284505968115714
idle-timeout = 0
auto-format = true
gutters = ["line-numbers", "spacer", "diff"]

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true
